name: Jurídico uFiscal

# Boletim jurídico (tributário, trabalhista, previdenciário, administrativo/licitações
# e empresarial). Mesmo motor do Notícias uFiscal, com o perfil perfis/juridico.json.
# Roda 5 minutos depois do Notícias uFiscal para não disputar o registro no repositório.
# Horários em UTC (Brasília = UTC-3, sem horário de verão):
#   20:00 BRT = 23:00 UTC   |   08:00 BRT = 11:00 UTC
# O GitHub às vezes atrasa ou pula agendamentos, então há execuções de reserva.
# O arquivo data/juridico/estado.json garante que cada edição seja enviada uma única vez:
# as reservas só agem se a principal falhou ou não rodou.
on:
  schedule:
    - cron: "7 23 * * *"    # 20:07 — edição da noite
    - cron: "25 23 * * *"   # 20:25 — reserva
    - cron: "50 23 * * *"   # 20:50 — reserva
    - cron: "35 0 * * *"    # 21:35 — última reserva
    - cron: "7 11 * * *"    # 08:07 — edição da manhã
    - cron: "25 11 * * *"   # 08:25 — reserva
    - cron: "50 11 * * *"   # 08:50 — reserva
    - cron: "35 12 * * *"   # 09:35 — última reserva
  workflow_dispatch:
    inputs:
      data:
        description: "Dia da edição (AAAA-MM-DD) — vazio = automático"
        required: false
      edicao:
        description: "Edição — vazio = automático"
        type: choice
        options: ["", "08h", "20h"]
        default: ""
      forcar:
        description: "Reenviar mesmo se já enviado"
        type: boolean
        default: false
      simular:
        description: "Só simular (não envia nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robo-juridico
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar e enviar
        env:
          PERFIL: juridico
          CANAIS: email
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMO: ${{ vars.RESUMO }}
          RESUMO_MODELO: ${{ vars.RESUMO_MODELO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO_JURIDICO || secrets.EMAIL_ADMIN || secrets.SMTP_USUARIO }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          ALERTA_FAKE_NEWS: ${{ vars.ALERTA_FAKE_NEWS }}
          ENTRADA_DATA: ${{ inputs.data }}
          ENTRADA_EDICAO: ${{ inputs.edicao }}
          ENTRADA_FORCAR: ${{ inputs.forcar }}
          ENTRADA_SIMULAR: ${{ inputs.simular }}
        run: |
          ARGS=()
          if [ -n "$ENTRADA_DATA" ]; then ARGS+=(--data "$ENTRADA_DATA"); fi
          if [ -n "$ENTRADA_EDICAO" ]; then ARGS+=(--edicao "$ENTRADA_EDICAO"); fi
          if [ "$ENTRADA_FORCAR" = "true" ]; then ARGS+=(--forcar); fi
          if [ "$ENTRADA_SIMULAR" = "true" ]; then ARGS+=(--simular); fi
          python -m noticias_bot "${ARGS[@]}"

      # Na simulação, publica a prévia no ramo "previa-juridico" (não afeta o robô)
      - name: Guardar prévia da simulação
        if: inputs.simular
        run: |
          cp -r saida/juridico /tmp/previa
          git config user.name "robo-noticias"
          git config user.email "robo-noticias@users.noreply.github.com"
          git checkout --orphan previa-juridico
          git rm -rq --cached . && git clean -fdqx -e .git
          cp -r /tmp/previa/* . && git add -A
          git commit -qm "prévia $(date -u +%FT%TZ)" && git push -f origin previa-juridico
          git checkout -q "${GITHUB_REF_NAME}"

      # Salva o registro de envios (mesmo se um canal falhou) e mantém o
      # repositório ativo — o GitHub desliga agendamentos após 60 dias parado.
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "robo-noticias"
          git config user.email "robo-noticias@users.noreply.github.com"
          git add data/juridico/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "estado jurídico: envio $(date -u +%FT%TZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
